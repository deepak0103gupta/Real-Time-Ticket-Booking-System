spring.application.name=booking-service
server.port=8083

spring.datasource.url=jdbc:mysql://localhost:3306/bookingdb
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


spring.data.redis.host=localhost
spring.data.redis.port=6379

booking.hold.duration-seconds=30

event-service.url=http://localhost:8081


spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all

booking.kafka.topic=booking-events

# how often the expiry scheduler runs
booking.expiry.scan-interval-ms=10000